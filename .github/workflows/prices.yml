# دستیار قیمت Vault: هر ساعت کانال تلگرام رو می‌خونه و prices.json رو کنار اپ به‌روز می‌کنه.
name: Vault prices
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: vault-prices
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Read channel
        run: node tools/fetch-prices.js
      - name: Save prices.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- prices.json)" ]; then echo "No new prices."; exit 0; fi
          git config user.name "vault-prices"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "prices: auto update"
          git pull --rebase
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 || true
